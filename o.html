<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Css Animations</title>
  <style>
    .box {
      
      height: 120px;
      width: 120px;
      background-color: rgb(208, 77, 11);
      border-radius: 60px;
      text-align: center;
      font-weight: 800;
      position: absolute;
      bottom: 0;
      left: 0;
      /* animation: name duration timing-function delay iteration-count direction fill-mode; */
      animation: animateX 3s linear infinite, 
                 animateY 1s ease-out infinite alternate;
                 /* animation-play-state: running; */
    }

    .container{
      margin: 150px 40px; /*top-bottom, left-right*/
      position: relative;
      height: 80vh;
      width: 80vw;
      background-color: rgb(71, 120, 163);
    }

    @keyframes animateX {
      from{
        left: 0;
      }
      to{
        left: 100%;
      }
    }

    @keyframes animateY {
      from{
        bottom: 0;
      }
      to{
        bottom: 100%;
      }
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="box">ball</div>
  </div>
</body>

</html>
