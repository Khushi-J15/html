<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    .box{
      height: 50px;
      width: 50px;
      background-color: beige;
      border: 2px solid black;
      /* transform: rotate(0.25turn); 90 degree */
      /* transform: rotateX(78deg); */
      transform:translate(70%); /*by default translateX*/
      transform: skew(34deg); /*by default skewX*/
      transform-origin: -50% -50%;
      transform: rotateX(39deg);
      transform: scaleX(2.9);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container{
      margin: 55px;
      width: 100vw;
      height: 80vh;
      border: 2px solid purple;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">box</div>
  </div>
</body>
</html>
