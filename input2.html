<!DOCTYPE html>
<head>
  <title>
    google url
  </title>  
  <style>
    .search-box{
        margin-left:20px;
        margin-top:20px;
        font-size:20px;
        border-radius:90px;
        width:400px;
        cursor:pointer;
    }
    .search-box:hover{
        box-shadow: 40px 60px 20px  rgba(241, 97, 7, 0.25);
    }

  </style>
</head>
<body>
  <input class="search-box" type="date" placeholder="Search Google or Type a URL">  
  <input class="search-box" type="image" placeholder="Search Google or Type a URL">  
  <input class="search-box" type="number" placeholder="Search Google or Type a URL">  
  <input class="search-box" type="file" placeholder="Search Google or Type a URL">  
</body>
