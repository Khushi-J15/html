<!DOCTYPE html>
<head>
  <title>
    linkedin signup
  </title>  
  <style>
   .email-text{
    margin-bottom:10px;
    background-color: aqua;
   }
   .box{
    border-radius:5px;
    margin-bottom:10px;
    cursor:pointer;
    width:400px;
   }
   .proceed{
    border-radius:18px;
    background-color:blue;
    color:white;
    cursor:pointer;
    padding-left:80px;
    padding-right:80px;
    padding-top:9px;
    padding-bottom:9px;
    border:none;
   }
   .disclaimer-text{
    margin-top:0px;
    font-family:arial;
   }
   #rightS{
    background-color: black;
    color: white;
   }
  </style>
</head>
<body> <!--paragraphs cover entire line [block element]-->
<p class="email-text">
    Email
</p>

<input class="box" type="text" >

<p class="disclaimer-text">
  <input class="search-box" type="number" placeholder="Search Google or Type a URL">  
    By clicking Agree & Join, you agree to the Privacy Policy <span id="rightS">&#10003</span>
 </p>
 <button class="proceed">
    Agree & Join
 </button>
</body>
</html>
